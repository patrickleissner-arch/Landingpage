name: SSH Diagnose - Server-Logs lesen (read-only)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Logs + .env-Struktur per SSH lesen (keine Änderungen)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASS }}
          script: |
            APP_PATH=$(find /home -name "server.js" -not -path "*/node_modules/*" 2>/dev/null | grep -v ".builds" | head -1 | xargs -I{} dirname {})
            echo "APP_PATH: $APP_PATH"
            echo "=== .env Struktur (nur Keys + Wertlängen) ==="
            awk -F= '{ printf "%s (len=%d)\n", $1, length($2) }' "$APP_PATH/.env"
            echo "=== Letzte 80 Zeilen console.log (stdout/stderr des Node-Prozesses) ==="
            tail -n 80 "$APP_PATH/console.log" 2>/dev/null || echo "Keine console.log gefunden"
