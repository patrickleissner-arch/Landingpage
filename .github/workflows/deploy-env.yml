name: Inject .env on Hostinger

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  inject-env:
    runs-on: ubuntu-latest
    steps:
      - name: Write .env via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER: ${{ secrets.BREVO_SENDER }}
          BREVO_NOTIFY: ${{ secrets.BREVO_NOTIFY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          BREVO_PIPELINE_ID: ${{ secrets.BREVO_PIPELINE_ID }}
          BREVO_DEAL_STAGE_ID: ${{ secrets.BREVO_DEAL_STAGE_ID }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASS }}
          envs: SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,MAIL_TO,BREVO_API_KEY,BREVO_SENDER,BREVO_NOTIFY,BREVO_LIST_ID,BREVO_PIPELINE_ID,BREVO_DEAL_STAGE_ID
          script: |
            APP_PATH=$(find /home -name "server.js" -not -path "*/node_modules/*" -not -path "*/.builds/*" 2>/dev/null | head -1 | xargs -I{} dirname {})
            if [ -z "$APP_PATH" ]; then
              echo "FEHLER: server.js nicht gefunden"; exit 1
            fi
            # .env eine Ebene ÜBER APP_PATH ablegen: Hostingers Auto-Deploy
            # rsynct bei jedem Push den Git-Checkout NACH APP_PATH (nodejs/)
            # und überschreibt/löscht dabei alles, was nicht im Repo ist -
            # inkl. einer dort liegenden .env. Außerhalb dieses Ordners ist
            # die Datei vor diesem rsync sicher (server.js liest sie jetzt
            # auch von dort, siehe path.join(__dirname, '..', '.env')).
            ENV_DIR=$(dirname "$APP_PATH")
            echo "APP_PATH: $APP_PATH"
            echo "ENV_DIR (.env-Zielordner): $ENV_DIR"
            printf 'SMTP_HOST=%s\nSMTP_PORT=%s\nSMTP_USER=%s\nSMTP_PASS=%s\nMAIL_TO=%s\nBREVO_API_KEY=%s\nBREVO_SENDER=%s\nBREVO_NOTIFY=%s\nBREVO_LIST_ID=%s\nBREVO_PIPELINE_ID=%s\nBREVO_DEAL_STAGE_ID=%s\n' \
              "$SMTP_HOST" "$SMTP_PORT" "$SMTP_USER" "$SMTP_PASS" "$MAIL_TO" "$BREVO_API_KEY" "$BREVO_SENDER" "$BREVO_NOTIFY" "$BREVO_LIST_ID" "$BREVO_PIPELINE_ID" "$BREVO_DEAL_STAGE_ID" \
              > "$ENV_DIR/.env"
            echo ".env geschrieben nach $ENV_DIR"
            # touch allein reicht bei LiteSpeed (lsnode) nicht zuverlässig: alte Worker-
            # Prozesse überleben das Signal teilweise und laufen mit veraltetem/leerem
            # .env weiter. Deshalb zusätzlich alle bestehenden Worker explizit beenden -
            # LiteSpeed spawnt beim nächsten Request automatisch frische Prozesse.
            mkdir -p "$APP_PATH/tmp"
            touch "$APP_PATH/tmp/restart.txt"
            pkill -f "lsnode:$APP_PATH" && echo "Alte lsnode-Worker beendet" || echo "Keine laufenden lsnode-Worker gefunden"
            sleep 5
            curl -s -o /dev/null -X POST https://patrickleissner.de/api/contact -H "Content-Type: application/json" -d '{}'
            sleep 3
            echo "=== .env Struktur (nur Keys + Wertlängen, keine Werte) ==="
            awk -F= '{ printf "%s (len=%d)\n", $1, length($2) }' "$ENV_DIR/.env"
            echo "=== Laufende lsnode-Worker dieser App + geladene Env-Keys ==="
            for PID in $(pgrep -f "lsnode:$APP_PATH"); do
              echo "--- PID $PID ---"
              tr '\0' '\n' < "/proc/$PID/environ" 2>/dev/null | cut -d= -f1 | sort | tr '\n' ','
              echo ""
            done
