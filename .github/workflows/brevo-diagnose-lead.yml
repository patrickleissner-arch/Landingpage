name: Brevo Diagnose - Energierechner-Lead-Listenzuordnung

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: BREVO_LIST_ID gegen Liste "Website Leads" (#2) prüfen
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
        run: |
          echo "=== Stimmt das Secret BREVO_LIST_ID mit Liste #2 (Website Leads) ueberein? ==="
          if [ "$BREVO_LIST_ID" = "2" ]; then
            echo "MATCH: BREVO_LIST_ID zeigt auf Liste #2"
          else
            echo "MISMATCH: BREVO_LIST_ID zeigt NICHT auf Liste #2 (Wert wird nicht ausgegeben)"
          fi

          echo ""
          echo "=== Alle Listen (id, name, totalSubscribers) ==="
          curl -s "https://api.brevo.com/v3/contacts/lists?limit=50" -H "api-key: $BREVO_API_KEY" -H "Accept: application/json" | jq '.lists[] | {id, name, totalSubscribers}'

          echo ""
          echo "=== Rohantwort Liste #2 (zum Debuggen, falls oben leer) ==="
          curl -s -w "\nHTTP-Status: %{http_code}\n" "https://api.brevo.com/v3/contacts/lists/2" -H "api-key: $BREVO_API_KEY" -H "Accept: application/json"

          echo ""
          echo "=== Die letzten 10 zuletzt geänderten Kontakte (roh, zum Debuggen) ==="
          curl -s -w "\nHTTP-Status: %{http_code}\n" "https://api.brevo.com/v3/contacts?sort=desc&limit=10" -H "api-key: $BREVO_API_KEY" -H "Accept: application/json"
